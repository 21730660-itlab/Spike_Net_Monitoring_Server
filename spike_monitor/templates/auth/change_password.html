{% extends "base.html" %}
{% block heading %}Change password{% endblock %}
{% block content %}
<div class="panel" style="max-width:480px">
  {% if forced %}<div class="flash error">For security you must choose a new password before using the system.</div>{% endif %}
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post" action="/account/password">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <p><label>Current password</label><input type="password" name="current_password" autocomplete="current-password" required></p>
    <p><label>New password</label><input type="password" name="new_password" autocomplete="new-password" required>
      <span class="help">At least 8 characters, with letters and numbers.</span></p>
    <p><label>Repeat new password</label><input type="password" name="confirm_password" autocomplete="new-password" required></p>
    <button class="btn primary">Save new password</button>
  </form>
</div>
{% endblock %}
